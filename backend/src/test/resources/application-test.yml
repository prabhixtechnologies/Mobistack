# Used only if a future integration test boots the full Spring context
# without Testcontainers. Unit tests in this repo do not load this file.
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

# An issuer nothing answers at: the context still assembles, and any bearer token presented to it
# is refused because no key can be fetched. Tests that need a valid token supply their own
# IdentityKeySource bean instead.
prabhix:
  identity:
    issuer: http://identity.test
    internal-base-url: http://identity.test
    service-token: test-service-token

fixflow:
  redis:
    enabled: false
  demo:
    seed-enabled: false
