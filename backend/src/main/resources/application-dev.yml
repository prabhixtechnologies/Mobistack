# Local development profile: run with -Dspring-boot.run.profiles=dev
#
# Sign-in needs a local Identity (Identity/README.md); its issuer is http://localhost:8081 unless
# IDENTITY_ISSUER says otherwise. Without one, no bearer token is accepted.
prabhix:
  identity:
    issuer: ${IDENTITY_ISSUER:http://localhost:8081}
    internal-base-url: ${IDENTITY_INTERNAL_URL:http://localhost:8081}
    service-token: ${IDENTITY_SERVICE_TOKEN:local-dev-identity-service-token}

fixflow:
  auth:
    web-origin: ${FIXFLOW_WEB_ORIGIN:http://localhost:5173}
  platform:
    public-origin: ${FIXFLOW_PUBLIC_ORIGIN:http://localhost:5173}
    api-origin: ${FIXFLOW_API_ORIGIN:http://localhost:8080}
    require-https: false
  redis:
    enabled: ${FIXFLOW_REDIS_ENABLED:false}
  demo:
    seed-enabled: true
    # Must be the address of an Identity account: the demo shop's owner row is a mirror of it.
    owner-email: owner@prabhixtechnologies.com

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fixflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
