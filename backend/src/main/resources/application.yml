spring:
  application:
    name: fixflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mobistack}
    username: ${SPRING_DATASOURCE_USERNAME:fixflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fixflow}
    hikari:
      pool-name: fixflow-pool
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Validate catches entity/migration drift at boot.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    # Off: the database is created empty and the schema is one baseline migration. With this on, a
    # schema that has tables but no history would be marked as already migrated at version 1 and the
    # baseline skipped, which is a mistake worth failing on rather than papering over.
    baseline-on-migrate: false
    locations: classpath:db/migration

  # Jackson 3 split the feature enums up, and Spring binds each of these blocks to a different one.
  # A key under the wrong block is not ignored: binding fails, so the mapper cannot be built, so the
  # application does not start. Which block a feature belongs to is therefore worth stating.
  jackson:
    default-property-inclusion: non_null
    serialization:
      # SerializationFeature
      indent-output: false
      order-map-entries-by-keys: false
    datatype:
      datetime:
        # Moved out of SerializationFeature into DateTimeFeature. Left explicit even though false is
        # now the Jackson default, because ISO-8601 strings rather than epoch numbers is a contract
        # with the clients, not a preference.
        write-dates-as-timestamps: false
    mapper:
      # MapperFeature, and on by default in Jackson 3, which would reorder the keys of every
      # response. No client here reads JSON positionally, so nothing should break — but it rewrites
      # the bytes on the wire for the whole API in a release whose only purpose is a framework
      # upgrade, and that is not a diff worth reasoning about when something else goes wrong.
      sort-properties-alphabetically: false

  # Moved here from server.error.* in the Boot 4 upgrade. The old keys bind to a different enum, so
  # Boot could not carry them across and ignored them in silence — no warning, no failure, just the
  # defaults. They happen to default to never as well, so nothing leaked, but "the safe thing was the
  # default" is luck rather than configuration and only the properties migrator revealed it.
  #
  # never on both: an error response carries a status and a correlation id, and nothing else. An
  # exception message names internal classes and often quotes the input that broke, and a stack trace
  # maps the whole application for whoever is probing it.
  web:
    error:
      include-message: never
      include-stacktrace: never

  threads:
    virtual:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cache:
    type: ${FIXFLOW_CACHE_TYPE:simple}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${FIXFLOW_REDIS_ENABLED:false}
    # SMTP is optional on first boot. A missing mailbox must not fail the process health check.
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}

fixflow:
  security:
    jwt:
      # Override in every real environment. Startup fails if this is under 64 chars.
      secret: ${FIXFLOW_SECURITY_JWT_SECRET:}
      issuer: mobistack
      access-token-ttl: 30m
      refresh-token-ttl: 30d
    identity:
      issuer: ${IDENTITY_ISSUER:}
      jwks-uri: ${IDENTITY_JWKS_URI:}
      jwks-cache-ttl: ${IDENTITY_JWKS_CACHE_TTL:PT10M}
      jwks-min-refresh-interval: ${IDENTITY_JWKS_MIN_REFRESH:PT30S}
      internal-base-url: ${IDENTITY_INTERNAL_URL:http://identity:8081}
      service-token: ${IDENTITY_SERVICE_TOKEN:}
    max-failed-logins: 8
    lockout-duration: 15m
  cors:
    allowed-origins:
      - https://mobistack.prabhixtechnologies.com
      - https://www.mobistack.prabhixtechnologies.com
      - http://localhost:5173
      - http://localhost:5176
      - http://localhost:4173
      - http://localhost:8081
      - http://localhost:19006
  inventory:
    dead-stock-days: 120
    critical-stock-factor: 0.34
  brand:
    organization: Prabhix Technologies Pvt Ltd
    product: MobiStack
    tagline: See what fits. See stock. Sell.
    organization-tagline: Building software that simplifies business
    copyright-year: 2026
  auth:
    web-origin: ${FIXFLOW_WEB_ORIGIN:https://mobistack.prabhixtechnologies.com}
    magic-link-path: /login?magic=
    # Off by default and switched on only in application-dev.yml. Enabling a
    # universal OTP and an SSO bypass in the base profile meant a mis-set
    # SPRING_PROFILES_ACTIVE handed out accounts to anyone who asked.
    dev-otp: ""
    dev-sso-enabled: false
    google-client-id: ${FIXFLOW_GOOGLE_CLIENT_ID:}
    google-client-secret: ${FIXFLOW_GOOGLE_CLIENT_SECRET:}
  platform:
    public-origin: ${FIXFLOW_PUBLIC_ORIGIN:https://mobistack.prabhixtechnologies.com}
    api-origin: ${FIXFLOW_API_ORIGIN:https://mobistack.prabhixtechnologies.com}
    support-email: ${FIXFLOW_SUPPORT_EMAIL:support@prabhixtechnologies.com}
    support-phone: ${FIXFLOW_SUPPORT_PHONE:}
    require-https: ${FIXFLOW_REQUIRE_HTTPS:false}
  redis:
    enabled: ${FIXFLOW_REDIS_ENABLED:false}
    presence-ttl: 90s
    dashboard-ttl: 20s
  devices:
    # Devices are screens belonging to one person (counter phone + web console).
    # Paid screen seats are counted per person, not per device.
    default-max-per-user: 3
    absolute-max-per-user: 5
    over-limit: evict
  chat:
    openai-api-key: ${FIXFLOW_OPENAI_API_KEY:}
    openai-model: ${FIXFLOW_OPENAI_MODEL:gpt-4o-mini}
  updates:
    expo-updates-url: ${FIXFLOW_EXPO_UPDATES_URL:}
    android-download-url: ${FIXFLOW_ANDROID_DOWNLOAD_URL:https://mobistack.prabhixtechnologies.com/download/android}
    ios-download-url: ${FIXFLOW_IOS_DOWNLOAD_URL:https://mobistack.prabhixtechnologies.com/download/ios}
    android-apk-path: ${FIXFLOW_ANDROID_APK_PATH:/var/mobistack/downloads/MobiStack.apk}
    ios-ipa-path: ${FIXFLOW_IOS_IPA_PATH:/var/mobistack/downloads/MobiStack.ipa}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    default-country-code: ${TWILIO_DEFAULT_COUNTRY_CODE:91}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  push:
    # Optional. Set it so Expo will only accept alerts signed by this account.
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  mail:
    host: ${SMTP_HOST:}
    from: ${SMTP_FROM:}
    username: ${SMTP_USERNAME:}
  demo:
    seed-enabled: false

logging:
  level:
    com.fixflow: INFO
    org.hibernate.SQL: WARN
  pattern:
    # requestId comes from CorrelationIdFilter and is echoed to the caller in the
    # X-Request-Id header, so a reported failure can be found in the log.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-no-request}] %-40.40logger{39} : %m%n"

---
# ElastiCache Serverless for Valkey. Always TLS, so the host/port settings above cannot reach it.
# Activate with SPRING_PROFILES_ACTIVE=prod,valkey.
#
# Points at the `mobistack` cache, not the one the Prabhix services share. Separate caches keep the
# eviction policy and a stray FLUSHALL from crossing between the two products.
#
# Configured as a single standalone endpoint and NOT as a cluster, which is the opposite of what the
# endpoint advertises about itself. This was measured on the Prabhix platform's identical cache
# before being applied here, and the reason is specific.
#
# ElastiCache Serverless answers CLUSTER SLOTS with two nodes covering slots 0-16383: an upstream on
# 6379 and a replica on 6380. Nothing listens on 6380. A cluster-aware Lettuce client therefore
# builds a topology containing a node it can never reach, and every attempt to use it fails with
# `RedisConnectionException: Unable to connect to <host>:6380`. The adaptive refresh that used to be
# configured here made it worse rather than better, because each refresh reinstated the dead node.
#
# What made this worth fixing rather than tolerating: the cache is not on the liveness path, so the
# application starts and reports healthy while caching and rate limiting are silently degraded.
#
# Standalone is safe because the endpoint is a proxy rather than a node and serves every slot
# itself. Verified against the real endpoint: keys spanning the keyspace were written and read back
# through a client with redirect-following disabled, with zero MOVED replies. A standalone client
# never requests the topology, so it never learns about 6380.
spring:
  config:
    activate:
      on-profile: valkey
  data:
    redis:
      # rediss://, with two s, is what enables TLS — the scheme carries it, so there is no separate
      # ssl.enabled here. No default, so a blank value fails startup loudly rather than falling back
      # to localhost and presenting as a working cache that merely has no data.
      #
      # REDIS_CLUSTER_NODES keeps its name even though this is no longer a cluster configuration: it
      # holds exactly the host:port this URL needs, and it is what the compose files and env examples
      # already set.
      url: rediss://${REDIS_CLUSTER_NODES}
