# Join laptop MobiStack to the Infra `prabhix` network (Identity already up).
# Usage (Infra stack must be running first):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.prabhix.yml up -d --build
#
# Does not publish Postgres (Infra already owns :5432). Points Identity at the shared issuer.

services:
  postgres:
    ports: !override []

  backend:
    environment:
      IDENTITY_ISSUER: http://localhost:8081
      IDENTITY_JWKS_URI: http://host.docker.internal:8081/.well-known/jwks.json
      FIXFLOW_ANDROID_DOWNLOAD_URL: https://store.prabhixtechnologies.com/mobistack/android.apk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - prabhix

  web:
    networks:
      - default
      - prabhix

networks:
  prabhix:
    external: true
    name: prabhix
