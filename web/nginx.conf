server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # connect-src includes local Identity (:8081) for OIDC token exchange, and local API (:8082)
    # when a Vite-dev build points VITE_API_ORIGIN there. Docker images leave VITE_API_ORIGIN blank
    # so the browser uses same-origin /api (covered by 'self') through nginx.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com https://*.rzp.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8081 http://localhost:8082 https://api.prabhixtechnologies.com https://id.prabhixtechnologies.com https://*.razorpay.com https://*.rzp.io wss://*.razorpay.com; frame-src https://checkout.razorpay.com https://*.razorpay.com https://*.rzp.io; child-src blob: https://checkout.razorpay.com https://*.razorpay.com; worker-src 'self' blob: https://*.razorpay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://*.razorpay.com https://*.rzp.io" always;


    # mobistack-backend, not backend, and the distinction is load-bearing once this container shares
    # a Docker network with another product.
    #
    # The Prabhix platform also has a service called `backend`. Docker's embedded DNS registers a
    # service name as a network alias on every network the container joins and gives no way to opt
    # out, so on a shared network the name `backend` resolves to two unrelated applications and
    # nginx would proxy to whichever address came back first. On the paths below that means
    # MobiStack's own API docs intermittently serving the other product's OpenAPI document.
    #
    # `mobistack-backend` is the service's name in the Infra repository's compose stack, where this
    # container runs locally and in production alike, so the name resolves the same way in both. It
    # cannot collide, because no other service on that network carries the product's name.
    location /api/ {
        proxy_pass http://mobistack-backend:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    # Direct APK / IPA files. The SPA must not swallow these paths.
    location /download/ {
        proxy_pass http://mobistack-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 502 '{"code":"UNAVAILABLE","message":"MobiStack is temporarily unavailable. Try again shortly."}';
    }

    location /swagger-ui {
        proxy_pass http://mobistack-backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://mobistack-backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
