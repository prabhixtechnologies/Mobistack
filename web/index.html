<!doctype html>
<!--
  data-brand and data-density select the generated token theme from
  web-kit/packages/brand/tokens.json: ochre accent, teal partner accent, warm sand surfaces,
  and the compact density a counter tool wants. Set here rather than from React so the first
  paint is already the right colour.
-->
<html lang="en" data-brand="mobistack" data-density="compact" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MobiStack · Prabhix Technologies</title>
    <meta name="description" content="MobiStack by Prabhix Technologies Pvt Ltd. See what fits. See stock. Sell." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="MobiStack" />
    <meta property="og:description" content="MobiStack by Prabhix Technologies Pvt Ltd. See what fits. See stock. Sell." />
    <meta property="og:image" content="/og.png" />
    <meta name="theme-color" content="#b45309" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mobistack.theme") || localStorage.getItem("fixflow.theme");
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          // Literal because this runs before any stylesheet has loaded, so the token
          // custom properties do not exist yet. Must match --px-bg / --px-accent for the
          // mobistack theme in web-kit/packages/brand/tokens.json.
          if (meta) meta.setAttribute("content", theme === "dark" ? "#12100e" : "#b45309");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
