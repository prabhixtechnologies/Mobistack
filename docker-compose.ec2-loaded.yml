# Use images already loaded on the instance (docker load). Does not pull from Hub.
# Postgres and Redis stay in containers.

services:
  backend:
    pull_policy: never
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}

  web:
    pull_policy: never
