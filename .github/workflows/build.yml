# Verifies and builds. Nothing here touches the running site or a store: this
# workflow decides whether a commit is deployable, and shipping it is a separate,
# hand-triggered decision made elsewhere.
#
#   build.yml         checks, tests, pushes images, builds the APK/AAB   (this file)
#   play-release.yml  uploads a build to Google Play
#
# Putting a build live is the Infra repository's Deploy workflow (Infra/.github/workflows/deploy.yml),
# which takes the short sha this workflow tagged the images with as mobistack_backend_tag and
# mobistack_web_tag. MobiStack runs there as the `mobistack` profile of the one production compose
# stack; this repository holds no compose files, no Caddyfile and no server access.
#
# Images go to Amazon ECR, and only there. The migration is finished and the Docker Hub path is
# gone, so there is nothing to configure per repository: no DOCKERHUB_* secrets, no
# AWS_CI_ROLE_ARN variable. The role is named in the push job and assumed through GitHub's OIDC
# provider, so no long-lived key is stored anywhere.
#
# The repositories prabhix/mobistack-backend and prabhix/mobistack-web must exist before the first
# push; deploy/aws/ecr-create-repos.sh in the Infra repository creates them.
#
# The push job now fails rather than skipping when it cannot reach the registry. It used to skip, so
# that a fork without credentials still got a green build, but that also meant a missing variable
# produced a passing run that pushed nothing.
#
# The Android build needs ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

name: Build and verify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (also always pushes latest + the short git sha)
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap guards for mistakes that only surface on the server, where the cost of
  # finding them is a broken deploy rather than a red build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No duplicate Flyway versions
        run: |
          set -euo pipefail
          dupes=$(ls backend/src/main/resources/db/migration/V*.sql \
            | xargs -n1 basename \
            | sed 's/__.*//' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Two migrations share a version, so Flyway will refuse to start:"
            echo "$dupes"
            exit 1
          fi
          echo "Migration versions are unique."

      - name: Development sign-in shortcuts stay out of the default profile
        run: |
          set -euo pipefail
          # dev-otp accepts one fixed code for every number, and dev-sso-enabled
          # signs in as anybody without a credential. Either reaching production
          # is a full authentication bypass, so the defaults must stay off and be
          # turned on only in application-dev.yml.
          base=backend/src/main/resources/application.yml
          if ! grep -qE '^\s+dev-otp:\s*""\s*$' "$base"; then
            echo "dev-otp is not blank in $base:"
            grep -nE '^\s+dev-otp:' "$base" || echo "  (setting is missing entirely)"
            exit 1
          fi
          if ! grep -qE '^\s+dev-sso-enabled:\s*false\s*$' "$base"; then
            echo "dev-sso-enabled is not false in $base:"
            grep -nE '^\s+dev-sso-enabled:' "$base" || echo "  (setting is missing entirely)"
            exit 1
          fi
          echo "Dev sign-in shortcuts are off by default."

  openapi:
    name: OpenAPI client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobistack-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mobistack-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate TypeScript client
        run: npm run generate
      - name: Fail if the snapshot or generated client drifted
        run: |
          set -euo pipefail
          git diff --exit-code --ignore-cr-at-eol -- src/schema.ts ../../backend/apidocs.json
          node -e "
            const s = require('../../backend/apidocs.json').components.schemas;
            for (const n of ['AuthenticatedUser','BillingOverview','CheckoutOrderResponse']) {
              if (!s[n]) { console.error('apidocs.json is missing schema ' + n); process.exit(1); }
            }
            console.log('MobiStack schemas present');
          "

  # The schema is one generated baseline (Platform's deploy/squash-baseline.py produced it), and
  # nothing else in CI runs it, so without this job a broken baseline reaches a real database first.
  #
  # The version-uniqueness check above is about filenames. This is about the SQL: the platform's
  # history contained a migration that recreated an existing index, which no existing database could
  # hit because they were all past it, and which made building an empty database impossible.
  migrations:
    name: Schema (empty database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schemacheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Baseline applies to an empty database
        run: |
          set -euo pipefail
          # --network host so the container can reach the service on localhost.
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url=jdbc:postgresql://localhost:5432/schemacheck \
            -user=postgres -password=ci \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 \
            migrate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Schema and seed data arrived
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          # A baseline truncated to nothing still "applies" cleanly, so check it left something
          # behind. Floors, not equalities: adding a table or a permission should not fail the
          # build, losing them should. Raise them when the schema grows.
          check() {
            actual=$(psql -h localhost -U postgres -d schemacheck -tAc "$2")
            if [ "$actual" -lt "$3" ]; then
              echo "FAIL: $1 is $actual, expected at least $3"
              exit 1
            fi
            printf '%-18s %s\n' "$1" "$actual"
          }
          check tables \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" 55
          # Without these two the schema loads and every user silently has no permissions at all.
          # 28 after COMMONS_REVIEW moved from a permission into commons_reviewers.
          check permissions "SELECT count(*) FROM permissions" 28
          check role_permissions "SELECT count(*) FROM role_permissions" 106
          check billing_plans "SELECT count(*) FROM billing_plans" 4
          # The compatibility graph and inventory rely on triggers, which a hand-edited baseline
          # would be the easiest thing in the file to drop. pg_trigger rather than
          # information_schema.triggers, which reports a row per event and so counts one trigger on
          # INSERT OR UPDATE twice.
          check triggers "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal" 20

      # The baseline creates no user, so a wiped database has nobody who can reach /api/v1/admin and
      # no way to get one. deploy/seed.sql is that account, and deploy/seed-commons.sql is the shared
      # compatibility catalog, which the baseline also leaves empty — the COMPATIBILITY plan sells
      # exactly one thing, and on an empty catalog it sells a blank screen.
      #
      # Both run twice. The catalog's natural keys are expression indexes on lower(name), so a guard
      # that compares without lowering inserts a duplicate on the second run and errors on neither.
      - name: Seeds apply twice without drift
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          seed() {
            psql -q -v ON_ERROR_STOP=1 \
              -v admin_email=ci@prabhixtechnologies.com \
              -v admin_password=ci-seed-password \
              -v admin_name='CI Seed' \
              -f deploy/seed.sql > /dev/null
            psql -q -v ON_ERROR_STOP=1 -f deploy/seed-commons.sql > /dev/null
          }

          counts() {
            psql -tAc "SELECT concat_ws(' ',
              (SELECT count(*) FROM users),
              (SELECT count(*) FROM shops),
              (SELECT count(*) FROM catalog_brands),
              (SELECT count(*) FROM catalog_devices),
              (SELECT count(*) FROM catalog_components),
              (SELECT count(*) FROM catalog_fitments))"
          }

          seed; first=$(counts)
          seed; second=$(counts)
          echo "users shops brands models parts fitments"
          echo "after one run:  $first"
          echo "after two runs: $second"
          if [ "$first" != "$second" ]; then
            echo "FAIL: the seeds are not idempotent"
            exit 1
          fi

      - name: Seeded admin can sign in
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          expect() {
            actual=$(psql -tAc "$2")
            if [ "$actual" != "$3" ]; then
              echo "FAIL: $1 is '$actual', expected '$3'"
              exit 1
            fi
            printf '%-40s %s\n' "$1" "$actual"
          }

          # crypt() against the stored hash is the comparison BCryptPasswordEncoder makes, and the
          # cost matters: a weaker hash still verifies, so nothing else would notice the drift.
          expect "password verifies" \
            "SELECT crypt('ci-seed-password', password_hash) = password_hash FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" t
          expect "a wrong password does not" \
            "SELECT crypt('wrong', password_hash) = password_hash FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" f
          expect "bcrypt cost is 12" \
            "SELECT left(password_hash, 7) FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" '$2a$12$'
          expect "admin, active and unlocked" \
            "SELECT system_admin AND active AND email_verified AND locked_until IS NULL FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" t
          # No shop on purpose: real shops provision themselves, and principalFor falls through to an
          # unscoped principal, which the admin console does not need a workspace for.
          expect "no placeholder workspace was created" \
            "SELECT count(*) FROM shops" 0

      # The seed's other job, and the one that gets used in anger: rerunning it is how a locked-out
      # operator gets back in, because there is no other way to reset the only admin account. If the
      # UPDATE ever stopped running on a second pass the script would still report success, still be
      # idempotent, and quietly no longer do the one thing it is reached for.
      - name: Re-running the seed recovers a locked-out admin
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          # Every way the account can be shut out at once.
          psql -q -c "UPDATE users SET failed_logins = 9,
                                       locked_until = now() + interval '1 day',
                                       active = false,
                                       must_change_pw = true,
                                       system_admin = false
                      WHERE lower(email) = 'ci@prabhixtechnologies.com'"

          psql -q -v ON_ERROR_STOP=1 \
            -v admin_email=ci@prabhixtechnologies.com \
            -v admin_password=rotated-password \
            -v admin_name='CI Seed' \
            -f deploy/seed.sql > /dev/null

          expect() {
            actual=$(psql -tAc "$2")
            if [ "$actual" != "$3" ]; then
              echo "FAIL: $1 is '$actual', expected '$3'"
              exit 1
            fi
            printf '%-40s %s\n' "$1" "$actual"
          }

          expect "the new password works" \
            "SELECT crypt('rotated-password', password_hash) = password_hash FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" t
          expect "the old password no longer does" \
            "SELECT crypt('ci-seed-password', password_hash) = password_hash FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" f
          expect "lockout and admin flag restored" \
            "SELECT locked_until IS NULL AND failed_logins = 0 AND active AND NOT must_change_pw AND system_admin FROM users WHERE lower(email) = 'ci@prabhixtechnologies.com'" t
          expect "no second account was created" \
            "SELECT count(*) FROM users" 1

      # The catalog's own consistency. Every part is named "<model> <part>" and fits the model it is
      # named for, so a mismatch means a part was attached to something else — which in this product
      # is a shop ordering forty of the wrong screen.
      - name: Catalog is self-consistent
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          expect() {
            actual=$(psql -tAc "$2")
            if [ "$actual" != "$3" ]; then
              echo "FAIL: $1 is '$actual', expected '$3'"
              exit 1
            fi
            printf '%-40s %s\n' "$1" "$actual"
          }

          expect "no EXACT fitment on another model" "
            SELECT count(*) FROM catalog_fitments f
            JOIN catalog_components c ON c.id = f.component_id
            JOIN catalog_devices d ON d.id = f.device_id
            WHERE f.fit_quality = 'EXACT' AND lower(c.name) NOT LIKE lower(d.name) || ' %'" 0
          # category_code is meant to match categories.code, and no constraint enforces it, so a typo
          # would file a part under a category no shop's sidebar has.
          expect "no part in an unknown category" "
            SELECT count(DISTINCT category_code) FROM catalog_components
            WHERE category_code NOT IN ('TEMPERED_GLASS','TOUCH_OCA','DISPLAY_FOLDER',
              'DISPLAY_CONNECTOR','FRAME','BACK_COVER','BATTERY','POWER_VOLUME_FLEX',
              'CHARGING_BOARD','CAMERA','SPEAKER','MICROPHONE','IC_CHIP','OTHER')" 0
          # Nothing shipped here has been on a bench. If a seeded row ever claims otherwise, a shop
          # sees "confirmed" against data nobody confirmed.
          expect "nothing claims to be verified" \
            "SELECT count(*) FROM catalog_fitments WHERE verified_at IS NOT NULL OR verified_by IS NOT NULL OR confirmations > 0" 0
          expect "every model has its six parts" "
            SELECT count(*) FROM catalog_devices d
            WHERE (SELECT count(*) FROM catalog_fitments f WHERE f.device_id = d.id) < 6" 0
          # The generated column depends on fixflow_normalize, which a hand-edited baseline could drop
          # while every INSERT above still succeeded.
          expect "normalized_name is generated" \
            "SELECT normalized_name FROM catalog_devices WHERE name = 'Nothing Phone (1)'" 'nothing phone 1'

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Identity client
        uses: actions/checkout@v4
        with:
          repository: prabhixtechnologies/Identity
          path: identity-client
          sparse-checkout: client
          sparse-checkout-cone-mode: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # GitHub Packages rejects an anonymous read of the Identity starter. Installing it from
          # source below is what the tests actually use; this entry covers any other resolution.
          server-id: github

      - name: Install Identity starter
        run: mvn -B -f identity-client/client/pom.xml -DskipTests install

      # Logged as well as printed so the next step can read it without running the suite again.
      # pipefail matters here: without it the step's exit code would be tee's, not Maven's.
      # -Pintegration, which clears the excludedGroups that would otherwise skip
      # ApplicationContextIntegrationTest — the only test here that starts the application rather
      # than constructing its classes with mocks. Every other test in this module passed throughout
      # the Boot 4 upgrade while the context was in fact unbuildable, so the default build's opinion
      # on "does this run" is worth nothing without it. Needs Docker, which this runner has.
      - name: Backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          set +e
          mvn -B test -Pintegration 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            {
              echo "### Backend test failure"
              echo '```'
              grep -E 'FAILURE|ERROR|Tests run:|Caused by:|Application run failed|Migration' build.log | tail -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -E 'FAILURE|ERROR|Tests run:' build.log | tail -n 12 | tr '\n' ' ' | cut -c1-700)
            echo "::error::$msg"
            exit "$code"
          fi

      # The pom hands Mockito's agent to the JVM at startup rather than letting it attach to a
      # running one, which the JDK warns about now and will refuse. Checked rather than assumed
      # because Mockito falls back to self-attaching and the suite still passes — so a green build is
      # not evidence the configuration is intact.
      - name: Mockito is not self-attaching
        working-directory: backend
        run: |
          set -euo pipefail
          fail=0

          if grep -q 'Mockito is currently self-attaching' build.log; then
            echo "::error::Mockito is self-attaching. The -javaagent in the surefire argLine is not reaching the test JVM."
            fail=1
          fi
          if grep -q 'A Java agent has been loaded dynamically' build.log; then
            echo "::error::An agent was loaded dynamically, which a future JDK disallows by default."
            grep -m3 'loaded dynamically' build.log
            fail=1
          fi
          # A log with no tests in it has no warnings in it either.
          if ! grep -qE 'Tests run: [0-9]+' build.log; then
            echo "::error::No test results in the output, so the absence of warnings proves nothing."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          grep -hoE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+' build.log | tail -1
          echo "The agent is loaded up front."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` is tsc plus a real Vite bundle: an import that only
      # resolves in dev fails here rather than after the image is pushed.
      - name: Web typecheck and build
        working-directory: web
        run: |
          # package.json points at ../../web-kit, which is the sibling checkout on a laptop
          # and is not inside this repository.
          git clone --depth 1 https://github.com/prabhixtechnologies/web-kit.git "$GITHUB_WORKSPACE/../web-kit"
          npm ci
          npm run build

  push:
    needs: [checks, migrations, test, openapi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token AWS exchanges for temporary credentials.
      id-token: write
    steps:
      # Amazon ECR is the only registry. The three-way choice that used to open this job -- ECR,
      # Docker Hub, or skip -- is gone with the Docker Hub account itself.
      #
      # The "skip" branch went too, and that is the substantive part. It existed so a fork with no
      # credentials got a green build rather than a failed push, but it also meant this repository
      # reported success while pushing nothing if a variable was ever unset. Nothing here is
      # configured per repository any more, so there is no state in which that can happen: OIDC
      # either works or the job fails.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The role ARN is written here rather than read from a repository variable. With one registry a
      # variable is not a cutover switch, only a way to be silently misconfigured, and the account ID
      # it contains is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # Same region as the EC2 instance that pulls these, so a deploy is not billed as
          # inter-region transfer.
          aws-region: ap-south-1

      # No long-lived key: the role is assumed through GitHub's OIDC provider and the docker
      # credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: tags
        env:
          # The host comes from the login step rather than a variable, so the account ID cannot drift
          # from the role that was actually assumed.
          #
          # Both images sit under the shared prabhix/ namespace, and the slash is required rather
          # than tidy: the deployer policy scopes ECR to repository/prabhix/*, and that pattern only
          # matches a name containing a slash. They keep their mobistack- prefix inside it, so the
          # repositories are prabhix/mobistack-backend and prabhix/mobistack-web.
          PREFIX: ${{ steps.ecr.outputs.registry }}/prabhix/
          EXTRA: ${{ github.event.inputs.tag }}
        run: |
          # The short sha, like every other repository's CI, because that is the tag the Deploy
          # workflow's inputs and deploy/.env.prod carry — and the one git and GitHub show, so it
          # can be copied rather than resolved. The full sha stays as well for the images already
          # pinned by it.
          short="${GITHUB_SHA:0:7}"
          {
            echo "backend<<EOF"
            echo "${PREFIX}mobistack-backend:latest"
            echo "${PREFIX}mobistack-backend:${short}"
            echo "${PREFIX}mobistack-backend:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${PREFIX}mobistack-backend:${EXTRA}"; fi
            echo "EOF"
            echo "web<<EOF"
            echo "${PREFIX}mobistack-web:latest"
            echo "${PREFIX}mobistack-web:${short}"
            echo "${PREFIX}mobistack-web:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${PREFIX}mobistack-web:${EXTRA}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy with: mobistack_backend_tag=${short} mobistack_web_tag=${short}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # The Dockerfile installs the Identity starter from this context instead of GitHub Packages.
          build-contexts: |
            identity-client=https://github.com/prabhixtechnologies/Identity.git#main:client
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          build-contexts: |
            webkit=https://github.com/prabhixtechnologies/web-kit.git#main
          build-args: |
            VITE_IDENTITY_ISSUER=https://api.prabhixtechnologies.com
            VITE_STORE_URL=https://store.prabhixtechnologies.com
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
