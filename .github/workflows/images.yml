# Image push needs repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN   (Hub access token, not the account password)
# Optional variable: DOCKERHUB_NAMESPACE (defaults to the username)
# Create private Hub repos mobistack-backend and mobistack-web before the first push.
# Tests still run when Hub secrets are missing.
# Release APK/AAB needs ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Deploy to EC2 needs EC2_HOST, EC2_USER,
# EC2_SSH_KEY, and EC2_APP_DIR. Play upload needs PLAY_STORE_SERVICE_ACCOUNT_JSON
# (Play Console service-account key JSON). Master pushes go to the internal track.

name: Build and push images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (also always pushes latest + git SHA)
        required: false
        default: ""
      play_track:
        description: Play Console track for the AAB (internal or production)
        required: false
        default: "internal"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap guards for mistakes that only surface on the server, where the cost of
  # finding them is a broken deploy rather than a red build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No duplicate Flyway versions
        run: |
          set -euo pipefail
          dupes=$(ls backend/src/main/resources/db/migration/V*.sql \
            | xargs -n1 basename \
            | sed 's/__.*//' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Two migrations share a version, so Flyway will refuse to start:"
            echo "$dupes"
            exit 1
          fi
          echo "Migration versions are unique."

      - name: Development sign-in shortcuts stay out of the default profile
        run: |
          set -euo pipefail
          # dev-otp accepts one fixed code for every number, and dev-sso-enabled
          # signs in as anybody without a credential. Either reaching production
          # is a full authentication bypass, so the defaults must stay off and be
          # turned on only in application-dev.yml.
          base=backend/src/main/resources/application.yml
          if ! grep -qE '^\s+dev-otp:\s*""\s*$' "$base"; then
            echo "dev-otp is not blank in $base:"
            grep -nE '^\s+dev-otp:' "$base" || echo "  (setting is missing entirely)"
            exit 1
          fi
          if ! grep -qE '^\s+dev-sso-enabled:\s*false\s*$' "$base"; then
            echo "dev-sso-enabled is not false in $base:"
            grep -nE '^\s+dev-sso-enabled:' "$base" || echo "  (setting is missing entirely)"
            exit 1
          fi
          echo "Dev sign-in shortcuts are off by default."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` is tsc plus a real Vite bundle: an import that only
      # resolves in dev fails here rather than after the image is pushed.
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile typecheck
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit

  push:
    needs: [checks, test]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - name: Decide whether Hub credentials are present
        id: hub
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Image push skipped: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repo Settings → Secrets."
            echo "Create private Hub repos mobistack-backend and mobistack-web first."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "ns=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hub.outputs.configured == 'true'

      - name: Resolve image tags
        if: steps.hub.outputs.configured == 'true'
        id: tags
        env:
          NS: ${{ steps.hub.outputs.ns }}
          EXTRA: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "backend<<EOF"
            echo "${NS}/mobistack-backend:latest"
            echo "${NS}/mobistack-backend:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-backend:${EXTRA}"; fi
            echo "EOF"
            echo "web<<EOF"
            echo "${NS}/mobistack-web:latest"
            echo "${NS}/mobistack-web:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-web:${EXTRA}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.hub.outputs.configured == 'true'

      - uses: docker/login-action@v3
        if: steps.hub.outputs.configured == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push backend
        if: steps.hub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push web
        if: steps.hub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://mobistack.prabhixtechnologies.com
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Assemble release APK and AAB
        working-directory: mobile
        run: node ./scripts/assemble-apk.js

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy-apk:
    needs: android-apk
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
    steps:
      - name: Decide whether EC2 deploy is configured
        id: ec2
        run: |
          if [ -z "${EC2_HOST}" ] || [ -z "${EC2_USER}" ] || [ -z "${EC2_SSH_KEY}" ] || [ -z "${EC2_APP_DIR}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "APK built, but not copied to the server. Add EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ec2.outputs.configured == 'true'
        with:
          name: mobistack-android-apk
          path: apk

      - name: Publish APK on EC2
        if: steps.ec2.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: apk/app-release.apk
          target: /tmp
          strip_components: 1
          overwrite: true

      - name: Replace live download
        if: steps.ec2.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            dest="${{ secrets.EC2_APP_DIR }}/downloads/MobiStack.apk"
            mkdir -p "$(dirname "$dest")"
            src=""
            for candidate in /tmp/app-release.apk /tmp/apk/app-release.apk; do
              if [ -f "$candidate" ]; then src="$candidate"; break; fi
            done
            if [ -z "$src" ]; then
              echo "APK not found under /tmp"; ls -la /tmp; exit 1
            fi
            mv "$src" "$dest"
            chmod 644 "$dest"
            ls -lh "$dest"

  deploy-play:
    needs: android-apk
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Decide whether Play upload is configured
        id: play
        run: |
          if [ -z "${PLAY_STORE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AAB built, but Play upload skipped. Add PLAY_STORE_SERVICE_ACCOUNT_JSON."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.play.outputs.configured == 'true'
        with:
          name: mobistack-android-aab
          path: aab

      - name: Upload AAB to Google Play
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.prabhix.fixflow
          releaseFiles: aab/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
          releaseName: ${{ github.sha }}

  ios-module:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Pack Xcode project
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, zipfile
          root = "mobile/ios"
          skip = {".gradle", "build", "Pods", "DerivedData"}
          with zipfile.ZipFile("dist/mobistack-ios-xcode.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in skip]
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      zf.write(path, os.path.relpath(path, "mobile"))
          PY

      - name: Install CocoaPods and build simulator app
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          pod install
          xcodebuild \
            -workspace FixFlow.xcworkspace \
            -scheme FixFlow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS module
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-ios-module
          path: |
            dist/mobistack-ios-xcode.zip
            mobile/ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
