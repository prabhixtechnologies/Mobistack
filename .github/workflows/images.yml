name: Build and push images

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "web/**"
      - "docker-compose.yml"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (also always pushes latest + git SHA)
        required: false
        default: ""

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web typecheck
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  push:
    needs: test
    runs-on: ubuntu-latest
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        env:
          EXTRA: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "backend<<EOF"
            echo "${NS}/mobistack-backend:latest"
            echo "${NS}/mobistack-backend:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-backend:${EXTRA}"; fi
            echo "EOF"
            echo "web<<EOF"
            echo "${NS}/mobistack-web:latest"
            echo "${NS}/mobistack-web:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-web:${EXTRA}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
