# Image push needs repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN   (Hub access token, not the account password)
# Optional variable: DOCKERHUB_NAMESPACE (defaults to the username)
# Create private Hub repos mobistack-backend and mobistack-web before the first push.
# Tests, APK, and the iOS module still run when those secrets are missing.

name: Build and push images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (also always pushes latest + git SHA)
        required: false
        default: ""

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web typecheck
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile typecheck
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit

  push:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - name: Decide whether Hub credentials are present
        id: hub
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Image push skipped: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repo Settings → Secrets."
            echo "Create private Hub repos mobistack-backend and mobistack-web first."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "ns=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hub.outputs.configured == 'true'

      - name: Resolve image tags
        if: steps.hub.outputs.configured == 'true'
        id: tags
        env:
          NS: ${{ steps.hub.outputs.ns }}
          EXTRA: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "backend<<EOF"
            echo "${NS}/mobistack-backend:latest"
            echo "${NS}/mobistack-backend:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-backend:${EXTRA}"; fi
            echo "EOF"
            echo "web<<EOF"
            echo "${NS}/mobistack-web:latest"
            echo "${NS}/mobistack-web:${GITHUB_SHA}"
            if [ -n "${EXTRA}" ]; then echo "${NS}/mobistack-web:${EXTRA}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.hub.outputs.configured == 'true'

      - uses: docker/login-action@v3
        if: steps.hub.outputs.configured == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push backend
        if: steps.hub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push web
        if: steps.hub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Assemble debug APK
        working-directory: mobile
        run: node ./scripts/assemble-apk.js debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-module:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Pack Xcode project
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, zipfile
          root = "mobile/ios"
          skip = {".gradle", "build", "Pods", "DerivedData"}
          with zipfile.ZipFile("dist/mobistack-ios-xcode.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in skip]
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      zf.write(path, os.path.relpath(path, "mobile"))
          PY

      - name: Install CocoaPods and build simulator app
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          pod install
          xcodebuild \
            -workspace FixFlow.xcworkspace \
            -scheme FixFlow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS module
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-ios-module
          path: |
            dist/mobistack-ios-xcode.zip
            mobile/ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
