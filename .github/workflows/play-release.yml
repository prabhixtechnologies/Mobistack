# Ships a build to Google Play. Deliberately manual: Play rejects a version code
# it has already accepted, so a store upload wired to every master push fails on
# the second push of the day over a number nobody changed. Releasing is a
# decision, not a side effect of committing.
#
# Needs the same signing secrets as the APK build -- ANDROID_RELEASE_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD -- plus
# PLAY_STORE_SERVICE_ACCOUNT_JSON (Play Console service-account key JSON).
#
# Before running: raise android.versionCode in mobile/app.json past the highest
# number Play has already accepted, or set version_code below. Play tracks that
# number per package forever, including on tracks you later abandon.

name: Release to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      version_code:
        description: Override android.versionCode (blank = use mobile/app.json)
        required: false
        default: ""
      status:
        description: Release status on that track
        required: true
        default: completed
        type: choice
        options: [completed, draft]

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://mobistack.prabhixtechnologies.com
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Fail here rather than after a ten-minute build, and fail loudly: an
      # unsigned or wrongly signed bundle cannot upgrade an installed app.
      - name: Check the release secrets are present
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -z "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" ]; then
            missing="$missing PLAY_STORE_SERVICE_ACCOUNT_JSON"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Play release is not configured::Missing repository secrets:$missing"
            exit 1
          fi
          echo "All release secrets are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Apply the version code override
        if: inputs.version_code != ''
        working-directory: mobile
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: node ./scripts/set-version-code.js

      - name: Report what is about to be released
        working-directory: mobile
        run: |
          set -euo pipefail
          node -e '
            const a = require("./app.json").expo;
            console.log(`Releasing ${a.name} ${a.version} (versionCode ${a.android.versionCode}) to ${process.argv[1]}`);
          ' "${{ inputs.track }}"

      - name: Assemble release AAB
        working-directory: mobile
        run: node ./scripts/assemble-apk.js

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.prabhix.fixflow
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ github.sha }}

      - name: Keep the built bundle for the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobistack-android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
