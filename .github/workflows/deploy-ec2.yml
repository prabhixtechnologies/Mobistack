# Puts a build live: restarts the server on it and refreshes the APK the site
# offers. Hand-triggered, and only builds that passed build.yml can be chosen --
# the images and the APK both come out of a single run of it, so the server and
# the download stay the same commit.
#
# Needs secrets EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR (absolute path of
# the checkout on the server).

name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build to deploy (latest, or a commit SHA -- short is fine)
        required: true
        default: latest
      refresh_apk:
        description: Also replace the APK the site offers for download
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Two deploys at once would race over the same containers.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - name: Check the server secrets are present
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          missing=""
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_APP_DIR; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy is not configured::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Needed to turn a short SHA or a branch name into a commit.
          fetch-depth: 0

      # Only a build that passed can go out. Images are pushed by build.yml and
      # nothing else, so asking for a commit it never built would otherwise fail
      # much later, on the server, as an unknown manifest.
      - name: Pick a build that passed
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.build }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$REPO" --workflow build.yml --branch main \
            --status success --limit 100 --json databaseId,headSha,createdAt)

          if [ "$REQUESTED" = latest ]; then
            picked=$(printf '%s' "$runs" | jq -c '.[0] // empty')
          else
            if ! sha=$(git rev-parse --verify --quiet "${REQUESTED}^{commit}"); then
              echo "::error title=Unknown build::\"$REQUESTED\" is not a commit in this repository."
              exit 1
            fi
            picked=$(printf '%s' "$runs" \
              | jq -c --arg sha "$sha" '[.[] | select(.headSha == $sha)][0] // empty')
          fi

          if [ -z "$picked" ]; then
            echo "::error title=Nothing to deploy::No successful \"Build and verify\" run for \"$REQUESTED\". Only a build that passed has images on the registry; check the Build and verify workflow."
            exit 1
          fi

          sha=$(printf '%s' "$picked" | jq -r .headSha)
          run_id=$(printf '%s' "$picked" | jq -r .databaseId)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          {
            echo "Deploying commit [\`${sha:0:7}\`](https://github.com/$REPO/commit/$sha)"
            echo "from build run [$run_id](https://github.com/$REPO/actions/runs/$run_id)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying $sha from build run $run_id"

  server:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # No script_stop. It sounds like errexit but is not: the action splits
          # the script on newlines and injects an exit-code test after every line
          # that does not end in a backslash. That mangles multi-line shell two
          # ways, and both have already cost a run here. `case "$x" in` gets a
          # command injected where a pattern must go, which is a parse error; and
          # a line after a pipeline gets injected before it, so PIPESTATUS is the
          # injected test's rather than the pipeline's -- a clean deploy reported
          # failure for exactly that reason. `set -euo pipefail` on the next line
          # does the intended job properly.
          script: |
            set -euo pipefail

            # Everything the deploy does runs inside this function so that a single
            # wrapper at the bottom can capture it. Six runs reported nothing but
            # "exited with status 1": remote output sits in a log group the viewer
            # collapses, hiding both ends of it, and the previous attempt at this
            # only wrapped the deploy script -- so a failure in the git sync above
            # it still vanished. Nothing may fail outside the wrapper.
            deploy() {
            set -euo pipefail
            phase="connecting"
            trap 'echo; echo "FAILED during: ${phase}" >&2' ERR
            at() { phase="$1"; echo ">>> ${phase}"; }

            at "entering ${{ secrets.EC2_APP_DIR }}"
            cd "${{ secrets.EC2_APP_DIR }}"
            if [ ! -d .git ]; then
              # This directory began as a hand-copied snapshot, which is how its
              # compose files went stale and its scripts arrived with CRLF. Adopt it
              # as a checkout here rather than asking someone to do it by hand: the
              # images carry the code, but compose and the Caddyfile are read on the
              # host, so the host has to be able to update them.
              at "adopting $PWD as a git checkout"
              backup="$HOME/mobistack-config-$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$backup"
              cp -a docker-compose*.yml deploy "$backup"/ 2>/dev/null || true
              echo "Previous config saved to $backup"
              git init
              git remote add origin https://github.com/prabhixtechnologies/Mobistack.git
              # Plumbing, because `git branch -m` cannot rename a branch that has
              # no commits yet on the git versions Amazon Linux ships.
              git symbolic-ref HEAD refs/heads/main
            fi

            # Fetch and reset rather than pull. Nothing on the server should ever
            # hold an edit worth keeping, and a pull can fail on a local change or a
            # diverged branch -- which is a deploy blocked by a file nobody meant to
            # edit. Reset always lands exactly on origin, with the line endings
            # .gitattributes asks for. .env and downloads/ are untracked, so they
            # survive it.
            at "syncing the checkout to origin/main"
            git remote set-url origin https://github.com/prabhixtechnologies/Mobistack.git
            git fetch origin main
            git reset --hard FETCH_HEAD
            git branch --set-upstream-to=origin/main main 2>/dev/null || true
            echo "Checkout now at $(git rev-parse --short HEAD)"

            at "resolving the requested image tag"
            # Images are tagged "latest" and the full 40-character commit SHA, but
            # the SHA people have at hand is the short one git and the GitHub UI
            # show. Expand it here -- the checkout knows the mapping -- so a short
            # SHA does not fail the pull as an unknown manifest.
            requested="${{ needs.resolve.outputs.sha }}"
            if [ "$requested" != "latest" ]; then
              if resolved=$(git rev-parse --verify --quiet "${requested}^{commit}"); then
                if [ "$resolved" != "$requested" ]; then
                  echo "Tag $requested resolves to $resolved"
                fi
                requested="$resolved"
              else
                echo "WARNING: $requested is not a commit in this checkout; using it as a literal tag." >&2
              fi
            fi
            export IMAGE_TAG="$requested"

            at "normalising line endings on the deploy scripts"
            # Last resort for a tree git does not manage: strip carriage returns,
            # since a CR reaches the shebang and the kernel then reports the
            # interpreter missing because it is looking for "bash\r".
            for script in deploy/*.sh; do
              # Guarded with a full if: under `set -e` a trailing failed test in an
              # && list takes the whole script down with it.
              if [ -f "$script" ]; then
                sed -i 's/\r$//' "$script"
              fi
            done
            if [ -f .env ] && grep -q "$(printf '\r')" .env; then
              echo "WARNING: .env contains carriage returns, so secrets read from it" >&2
              echo "may carry a trailing CR and fail signature checks." >&2
            fi
            at "running deploy/ec2-up.sh"
            # Called through bash rather than executed, so a missing exec bit on a
            # fresh checkout cannot stop the deploy either.
            bash deploy/ec2-up.sh

            # A restart that keeps serving the old build is a failed deploy, and the
            # last two attempts looked fine from the outside while changing nothing.
            # X-Request-Id is set on every response by a filter this release adds, so
            # its presence is proof the new image is the one answering.
            at "waiting for the new build to answer"
            live=0
            for _ in $(seq 1 40); do
              if curl -fsS -m 5 -D /tmp/mobistack-headers -o /dev/null \
                   https://mobistack.prabhixtechnologies.com/actuator/health 2>/dev/null \
                 && grep -qi '^x-request-id:' /tmp/mobistack-headers; then
                live=1
                break
              fi
              sleep 5
            done
            rm -f /tmp/mobistack-headers
            if [ "$live" != "1" ]; then
              # Containers started but the API is not answering as the new build,
              # which usually means it died on boot -- a failed migration or a
              # setting it refuses to start without. Its own logs say which.
              echo "The API never reported the new build. Its last 60 log lines:" >&2
              docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml \
                logs --tail=60 --no-color backend 2>&1 || true
              exit 1
            fi
            echo "New build is live and answering."
            }

            # `deploy` records its own status in a file instead of the caller
            # reading PIPESTATUS. Errexit is suppressed inside an `if` condition,
            # function bodies included, so `if ! deploy | tee` reported a failed
            # deploy as a success; PIPESTATUS fixed that but then a run that
            # deployed the site cleanly reported failure. The status of a function
            # on the left of a pipeline is simply too easy to lose. An empty file
            # means the subshell died under `set -e` before recording anything,
            # which is a failure by definition.
            #
            # Stdin comes from /dev/null because the script itself arrives over
            # stdin: a command inside that reads it would swallow the rest.
            rc_file=/tmp/mobistack-deploy.rc
            : > "$rc_file"
            set +e
            { deploy; echo "$?" > "$rc_file"; } </dev/null 2>&1 \
              | tee /tmp/mobistack-deploy.log
            rc=$(cat "$rc_file" 2>/dev/null)
            set -e
            case "$rc" in
              '' | *[!0-9]*) rc=1 ;;
            esac
            rm -f "$rc_file"

            # Always stated, so the next surprise is one line to diagnose rather
            # than a guess about which layer lost the status.
            echo "deploy finished with status ${rc}"
            if [ "$rc" -ne 0 ]; then
              # Fold the tail into a workflow annotation: annotations render on the
              # run summary, which is the only part of a failed run that is legible
              # without expanding a collapsed log group.
              detail=$(tail -n 25 /tmp/mobistack-deploy.log \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{ printf "%s%%0A", $0 }')
              echo "::error title=EC2 deploy failed::${detail}"
              exit "$rc"
            fi

  # Runs after the server, and only if the server came up: a download that is
  # newer than the API it talks to is worse than a stale one.
  apk:
    needs: [resolve, server]
    if: ${{ inputs.refresh_apk }}
    runs-on: ubuntu-latest
    steps:
      # The APK from that same build, rather than a fresh one. Rebuilding would
      # produce a different artifact from the one the build verified, and this
      # workflow is meant to ship a decided-upon build.
      - name: Take the APK from that build
        uses: actions/download-artifact@v4
        with:
          name: mobistack-android-apk
          path: apk
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Copy it to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: apk/app-release.apk
          target: /tmp
          strip_components: 1
          overwrite: true

      - name: Replace the live download
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Omitted for the same reason as the server step above: it rewrites
          # multi-line scripts, and this one has a loop and an if.
          script: |
            set -euo pipefail
            dest="${{ secrets.EC2_APP_DIR }}/downloads/MobiStack.apk"
            mkdir -p "$(dirname "$dest")"
            src=""
            for candidate in /tmp/app-release.apk /tmp/apk/app-release.apk; do
              if [ -f "$candidate" ]; then src="$candidate"; break; fi
            done
            if [ -z "$src" ]; then
              echo "::error title=APK not delivered::Nothing to install at /tmp/app-release.apk; the copy step did not leave a file."
              ls -la /tmp
              exit 1
            fi
            # Same path the site links to, replaced in one move so nobody can
            # download a half-written file.
            mv "$src" "$dest"
            chmod 644 "$dest"
            ls -lh "$dest"
