# Running MobiStack on the shared Prabhix box, alongside the platform stack.
#
# Layered on top of docker-compose.prod.yml, not instead of it: that file still owns the memory
# limits and the JVM flags, which do not change because of where the stack runs. What changes here
# is everything that assumed MobiStack had a machine to itself.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.shared.yml \
#     --profile prod up -d backend web
#
# Three things are different on a shared box, and each one is a container that must not start.
#
# postgres, because the database is RDS now. The prod overlay still gives that container 512m and
# calls itself transitional; this is the file where the transition finishes.
#
# redis, already parked in the prod overlay, because the cache is the `mobistack` ElastiCache
# Valkey serverless endpoint.
#
# caddy, because the platform's Caddy already holds ports 80 and 443. Two containers cannot bind
# them, and the second one to try simply fails to start. MobiStack's hostname is served by the
# platform's Caddy instead, from deploy/conf.d/mobistack.caddyfile in the Platform repository.

services:
  # `never` is a profile nothing activates, which switches a service off without deleting it from a
  # file that local development still uses. Same device the prod overlay already uses for redis.
  postgres:
    profiles:
      - never

  caddy:
    profiles:
      - never

  backend:
    # !reset rather than a narrower mapping. The prod overlay waits for the postgres container to
    # report healthy, and that container no longer starts, so left alone the backend would wait for
    # a service compose has been told never to run and the deploy would hang before it began.
    depends_on: !reset null
    # Android APKs are on the company store (S3). No host downloads/ volume on the shared box.
    volumes: !reset null
    environment:
      # The base file hardcodes jdbc:postgresql://postgres:5432/... — the one value in the whole
      # stack that was never parameterised, because until now there was only ever one answer.
      #
      # Direct to RDS, not through the platform's pgbouncer. That pooler is configured with a single
      # database name and serves `oneops` only, so pointing at it would connect MobiStack to the
      # wrong product's data. A pooler for this database is a later change and needs its own entry.
      #
      # sslmode=require because RDS ships rds.force_ssl=1, and the error it returns for an
      # unencrypted attempt is "no pg_hba.conf entry for host", which reads like a firewall problem
      # rather than a missing TLS negotiation and has cost an afternoon before.
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://${MOBISTACK_DB_HOST:?set MOBISTACK_DB_HOST in .env}:${MOBISTACK_DB_PORT:-5432}/${MOBISTACK_DB_NAME:-mobistack}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${MOBISTACK_DB_USER:?set MOBISTACK_DB_USER in .env}
      # The RDS instance is small and shared with three other databases, so this stack does not get
      # to open a default-sized pool per replica. Ten is enough for the request rate this product
      # sees and leaves headroom for the platform's own pool.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${MOBISTACK_DB_POOL_MAX:-10}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${MOBISTACK_DB_POOL_MIN:-2}
    networks:
      shared:
        aliases:
          - mobistack-backend

  web:
    networks:
      shared:
        aliases:
          - mobistack-web

networks:
  # The platform's network, created by the platform's compose project, which is why this is external:
  # compose must attach to it rather than try to create it and fail because the name is taken.
  #
  # Joining it is what lets the platform's Caddy reach these containers at all. It is also what makes
  # the aliases above necessary — see the note on proxy_pass in web/nginx.conf for what sharing a
  # network with a product that also calls its services `backend` and `web` does to name resolution.
  shared:
    name: ${SHARED_NETWORK:-prabhix}
    external: true
