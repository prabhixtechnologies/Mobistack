# EC2 overlay. Pull published images — do not compile on the server.
# Postgres and Redis stay on the Docker network. Only Caddy is public (80/443).

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  backend:
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FIXFLOW_SECURITY_JWT_SECRET: ${FIXFLOW_SECURITY_JWT_SECRET:?set a 64+ character JWT secret in .env}
      FIXFLOW_WEB_ORIGIN: ${FIXFLOW_WEB_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_PUBLIC_ORIGIN: ${FIXFLOW_PUBLIC_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_API_ORIGIN: ${FIXFLOW_API_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_REQUIRE_HTTPS: "true"
      FIXFLOW_REDIS_ENABLED: "true"
      FIXFLOW_CACHE_TYPE: redis
      # Payment gates workspace access, so the live keys and the webhook secret
      # are all required: without the secret a successful payment never lands.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      # Not required to boot: checkout verification already activates a plan.
      # Without it we lose only the fallback for a customer who paid and then
      # closed the tab before the browser could confirm.
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

  web:
    pull_policy: always
