# MobiStack stack.
#
# Laptop (demo seed, published debug ports):
#   docker compose --profile full -f docker-compose.yml -f docker-compose.local.yml up --build -d
#
# Publish after a local test (normally CI does this; the script is the manual fallback):
#   .\deploy\publish.ps1
#
# EC2 (pull ECR images, HTTPS on 80/443 only):
#   ./deploy/ec2-up.sh
#
# Set IMAGE_TAG in .env to pin a build. REGISTRY only needs setting to point at a different ECR
# account or region; it already defaults to ours.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobistack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobistack}
      POSTGRES_USER: ${POSTGRES_USER:-mobistack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobistack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mobistack-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["full", "prod"]
    # REGISTRY is the ECR host. It is defaulted rather than required because every box that pulls
    # these uses the same account and region, and an unset variable would otherwise resolve to a
    # bare `/prabhix/...` that Docker reads as a Hub image.
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/mobistack-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: mobistack-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mobistack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mobistack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mobistack}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FIXFLOW_REDIS_ENABLED: ${FIXFLOW_REDIS_ENABLED:-true}
      FIXFLOW_CACHE_TYPE: redis
      FIXFLOW_SECURITY_JWT_SECRET: ${FIXFLOW_SECURITY_JWT_SECRET:-}
      FIXFLOW_WEB_ORIGIN: ${FIXFLOW_WEB_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_PUBLIC_ORIGIN: ${FIXFLOW_PUBLIC_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_API_ORIGIN: ${FIXFLOW_API_ORIGIN:-https://mobistack.prabhixtechnologies.com}
      FIXFLOW_REQUIRE_HTTPS: ${FIXFLOW_REQUIRE_HTTPS:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      FIXFLOW_GOOGLE_CLIENT_ID: ${FIXFLOW_GOOGLE_CLIENT_ID:-}
      FIXFLOW_GOOGLE_CLIENT_SECRET: ${FIXFLOW_GOOGLE_CLIENT_SECRET:-}
      FIXFLOW_OPENAI_API_KEY: ${FIXFLOW_OPENAI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Without this the webhook endpoint rejects every call, so a payment that
      # succeeds at Razorpay never activates the workspace.
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      FIXFLOW_ANDROID_APK_PATH: ${FIXFLOW_ANDROID_APK_PATH:-/var/mobistack/downloads/MobiStack.apk}
      FIXFLOW_IOS_IPA_PATH: ${FIXFLOW_IOS_IPA_PATH:-/var/mobistack/downloads/MobiStack.ipa}
    volumes:
      - ${MOBISTACK_DOWNLOADS:-./downloads}:/var/mobistack/downloads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/liveness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  web:
    profiles: ["full", "prod"]
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/mobistack-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      args:
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    container_name: mobistack-web
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2.10-alpine
    container_name: mobistack-caddy
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@prabhixtechnologies.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
